<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>活動節目表 · Event Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bevan&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15181C; --card:#1E2227; --line:#2C3138; --ink:#F4F1E8; --sub:#9AA0AA;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Space Grotesk", system-ui, -apple-system, "PingFang TC", sans-serif;
  min-height:100dvh;
}
a{color:inherit;text-decoration:none}

header{padding:48px 20px 8px;max-width:760px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
h1{font-family:"Bevan","Space Grotesk",sans-serif;font-size:30px;line-height:1.25;margin-top:10px;letter-spacing:.01em}
header p{font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.7;max-width:52ch}

main{max-width:760px;margin:0 auto;padding:28px 20px 60px;display:grid;gap:16px}

.card{
  position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--c-bg,var(--card)); color:var(--c-ink,var(--ink));
  padding:22px 22px 24px;display:block;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
@media(hover:hover){
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.35);border-color:var(--c-accent,var(--line))}
}
.card:active{transform:translateY(-1px)}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c-accent,transparent);
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-tag{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  padding:4px 10px;border-radius:999px;background:var(--c-accent,#555);color:var(--c-accent-ink,#fff);
  white-space:nowrap;
}
.card-name{font-family:"Bevan","Space Grotesk",sans-serif;font-size:24px;margin-top:14px;letter-spacing:.01em}
.card-when{font-size:12.5px;color:var(--c-sub,var(--sub));margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.card-desc{font-size:12.5px;color:var(--c-sub,var(--sub));margin-top:12px;line-height:1.7}
.card-go{
  display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:12.5px;font-weight:600;
  letter-spacing:.04em;color:var(--c-accent,var(--ink));
}
.card-go .arr{transition:transform .2s ease}
.card:hover .card-go .arr{transform:translateX(3px)}

.stampede{--c-bg:#FAF7F2; --c-ink:#1A1A1A; --c-sub:#6B6B6B; --c-accent:#B3402A; --c-accent-ink:#FAF7F2}
.t2e{--c-bg:#1E3835; --c-ink:#F4E8C8; --c-sub:#9BC0B5; --c-accent:#E1573C; --c-accent-ink:#2A1610}

.spruce{--c-bg:#F6EFE0; --c-ink:#2B1A1D; --c-sub:#85706F; --c-accent:#1F4D3A; --c-accent-ink:#F6EFE0}

.soon{
  border-style:dashed; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:12.5px; padding:32px 22px; cursor:default;
}
@media(hover:hover){.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}}

footer{max-width:760px;margin:0 auto;padding:0 20px 40px;font-size:10.5px;color:var(--sub);line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Event Guide · 活動入口</div>
  <h1>選一個活動，看即時節目表</h1>
  <p>搜尋活動、篩選場地、點地圖找攤位、收藏想去的場次——每個活動都有自己的一頁。之後有新活動，也會加進這裡。</p>
</header>

<main id="cards"></main>

<footer>
  各活動頁面的資料整理自主辦單位公告的節目表／海報，細節請以官方公告為準。
</footer>

<script>
const EVENTS=[
  {
    key:"stampede", cls:"stampede", tag:"Jul 7",
    name:"Calgary Stampede",
    when:"Tuesday, July 7 · Park open 10 a.m. – midnight",
    desc:"牛仔競技、馬術表演、演唱會、市集與美食——整座園區的全日節目表，含即時定位地圖。",
    href:"/stampede.html",
  },
  {
    key:"t2e", cls:"t2e", tag:"Aug 1–2",
    name:"T2E Fest 2026",
    when:"Night Shift · Sat Aug 1, 6–11pm　·　Day Fest · Sun Aug 2, 10am–4pm",
    desc:"Greenview Industrial 的機車特技、樂團演出、月光市集、改裝車展與親子活動，分 Night Shift / Day Fest 兩個節目表。",
    href:"/t2e.html",
  },
  {
    key:"spruce", cls:"spruce", tag:"Nov 13 – Dec 6",
    name:"Spruce Meadows Christmas Market",
    when:"4 個週末 · Nov 13–15 · 20–22 · 27–29 · Dec 4–6",
    desc:"12 個市集地點、室內餐飲攤位與園區地圖，附「逛遍每個地點」打卡清單。",
    href:"/spruce.html",
  },
];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
document.getElementById("cards").innerHTML = EVENTS.map(e=>`
  <a class="card ${e.cls}" href="${e.href}">
    <div class="card-top">
      <div class="card-tag">${esc(e.tag)}</div>
    </div>
    <div class="card-name">${esc(e.name)}</div>
    <div class="card-when">${esc(e.when)}</div>
    <div class="card-desc">${esc(e.desc)}</div>
    <div class="card-go">查看節目表 <span class="arr">→</span></div>
  </a>
`).join("") + `<div class="card soon">更多活動陸續加入⋯</div>`;
</script>
</body>
</html>
